<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LGTM Playground</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <span class="wordmark">🔍 LGTM</span>
  </header>

  <main>
    <section class="panel">
      <div class="panel-header">
        <h2>Your code</h2>
        <button id="run-button" class="run-button">
          <span id="run-spinner" class="spinner" hidden></span>
          <span id="run-label">Run ▶</span>
        </button>
      </div>
      <div id="editor" class="editor"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Output</h2>
        <div class="panel-actions">
          <button id="share-button" class="share-button" type="button" hidden>Share 🔗</button>
          <a id="ipfs-link" class="ipfs-link" href="#" target="_blank" rel="noopener" hidden>IPFS ↗</a>
        </div>
      </div>
      <div id="share-box" class="share-box" hidden>
        <input id="share-url" class="share-url" type="text" readonly aria-label="Share link" />
        <span id="share-hint" class="share-hint" aria-live="polite"></span>
      </div>
      <pre id="output" class="output" aria-live="polite"></pre>
      <div id="run-meta" class="run-meta" hidden>
        <span id="run-timings"></span>
        <a id="trace-link" class="ipfs-link" href="#" target="_blank" rel="noopener" hidden>View trace ↗</a>
      </div>
    </section>
  </main>

  <footer class="footer">LGTM by viceda-s</footer>

  <script src="/vendor/monaco/min/vs/loader.js"></script>
  <script src="/app.js"></script>
</body>
</html>
