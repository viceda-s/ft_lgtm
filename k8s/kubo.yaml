apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubo-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kubo
  template:
    metadata:
      labels:
        app: kubo
    spec:
      containers:
        - name: kubo
          image: ipfs/kubo:v0.35.0
          ports:
            - name: swarm
              containerPort: 4001
            - name: api
              containerPort: 5001
            - name: gateway
              containerPort: 8080
          volumeMounts:
            - name: kubo-data
              mountPath: /data/ipfs
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - wget -qO- --post-data='' http://127.0.0.1:5001/api/v0/version >dev/null
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
      volumes:
        - name: kubo-data
          persistentVolumeClaim:
            claimName: kubo-data

---
apiVersion: v1
kind: Service
metadata:
  name: kubo
spec:
  selector:
    app: kubo
  ports:
    - name: api
      port: 5001
      targetPort: api
    - name: gateway
      port: 8080
      targetPort: gateway
    - name: swarn
      port: 4001
      targetPort: swarn

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubo-gateway
spec:
  ingressClassName: nginx
  rules:
    - host: ipfs.lgtm.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubo
                port:
                  name: gateway