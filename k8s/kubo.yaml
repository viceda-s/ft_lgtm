apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubo-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubo-init
data:
  gateway.sh: |
    ipfs config --json Gateway.NoDNSLink true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kubo
  template:
    metadata:
      labels:
        app: kubo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: kubo
          image: ipfs/kubo:v0.35.0
          env:
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector-opentelemetry-collector:4317
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_always_off
          ports:
            - name: swarm
              containerPort: 4001
            - name: swarm-udp
              containerPort: 4001
              protocol: UDP
            - name: api
              containerPort: 5001
            - name: gateway
              containerPort: 8080
          volumeMounts:
            - name: kubo-data
              mountPath: /data/ipfs
            - name: kubo-init
              mountPath: /container-init.d/gateway.sh
              subPath: gateway.sh
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - wget -qO- --post-data='' http://127.0.0.1:5001/api/v0/version >/dev/null
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 1Gi
              ephemeral-storage: 512Mi
      volumes:
        - name: kubo-data
          persistentVolumeClaim:
            claimName: kubo-data
        - name: kubo-init
          configMap:
            name: kubo-init

---
apiVersion: v1
kind: Service
metadata:
  name: kubo
spec:
  selector:
    app: kubo
  ports:
    - name: api
      port: 5001
      targetPort: api
    - name: gateway
      port: 8080
      targetPort: gateway

---
apiVersion: v1
kind: Service
metadata:
  name: kubo-swarm
spec:
  type: LoadBalancer
  selector:
    app: kubo
  ports:
    - name: swarm-tcp
      port: 4001
      targetPort: swarm
      protocol: TCP
    - name: swarm-udp
      port: 4001
      targetPort: swarm-udp
      protocol: UDP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubo-gateway
spec:
  ingressClassName: nginx
  rules:
    - host: ipfs.lgtm.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubo
                port:
                  name: gateway