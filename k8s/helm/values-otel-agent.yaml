mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib

presets:
  kubeletMetrics:
    enabled: true

config:
  exporters:
    otlp/gateway:
      endpoint: otel-collector-opentelemetry-collector:4317
      tls:
        insecure: true

  service:
    pipelines:
      metrics:
        receivers: []
        processors: [batch]
        exporters: [otlp/gateway]
      traces: null
      logs: null

ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi
