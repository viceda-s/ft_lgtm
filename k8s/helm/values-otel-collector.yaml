mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib

presets:
  clusterMetrics:
    enabled: true

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
    k8s_cluster:
      allocatable_types_to_report: [cpu, memory]

  exporters:
    otlp_http/tempo:
      endpoint: http://tempo:4318
      tls:
        insecure: true
    otlp_http/loki:
      endpoint: http://loki:3100/otlp
      tls:
        insecure: true
    prometheus_remote_write/mimir:
      endpoint: http://mimir-gateway/api/v1/push
      resource_constant_labels:
        included: ["k8s.*"]
      tls:
        insecure: true

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp_http/tempo]
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [prometheus_remote_write/mimir]
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp_http/loki]

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP