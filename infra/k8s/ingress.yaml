apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lgtm
spec:
  ingressClassName: nginx
  rules:
    - host: lgtm.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
